name: Update Market Data

on:
  schedule:
    # Todos os dias às 9h no horário de Brasília (12h UTC).
    - cron: '0 12 * * *'
  workflow_dispatch:

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      MARKET_DATA_TOKEN: ${{ secrets.MARKET_DATA_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI smoke tests
        run: npm run test:ui

      - name: Generate data
        run: npm run generate

      - name: Build historical dashboard data
        run: npm run build:history

      - name: Audit generated classifications
        run: npm run audit:data

      - name: Audit historical dashboard data
        run: npm run audit:history

      - name: Run historical dashboard smoke tests
        run: npm run test:history-ui

      - name: Commit and push if changed
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git add data.js history-data.js history/*.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): update market data and history [skip ci]"
            git push
          fi
