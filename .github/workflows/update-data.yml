name: Update Market Data

on:
  schedule:
    # Todos os dias às 9h no horário de Brasília (12h UTC).
    - cron: '0 12 * * *'
  workflow_dispatch:

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      MARKET_DATA_TOKEN: ${{ secrets.MARKET_DATA_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate data (Scraper)
        continue-on-error: true
        run: npm run generate

      - name: Validate generated data
        continue-on-error: true
        run: npm run validate:data

      - name: Build historical dashboard data
        continue-on-error: true
        run: npm run build:history

      - name: Commit and push market data
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git add data.js history-data.js history/*.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git pull --rebase origin master || true
            git commit -m "chore(data): update market data and history [skip ci]"
            git push origin master || git push --force-with-lease origin master || true
          else
            echo "Nenhuma mudança nos dados para commitar."
          fi
